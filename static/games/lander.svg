<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#000"/>
  <g fill="#fff" opacity=".5">
    <circle cx="30" cy="30" r="1"/><circle cx="90" cy="70" r=".8"/><circle cx="150" cy="20" r="1.1"/>
    <circle cx="250" cy="50" r=".9"/><circle cx="330" cy="25" r="1"/><circle cx="370" cy="90" r=".8"/>
    <circle cx="60" cy="120" r=".7"/><circle cx="300" cy="120" r=".7"/>
  </g>
  <!-- terrain with pads -->
  <path d="M0 240 L22 214 L40 230 L58 196 L74 206 L92 206 L110 176 L128 222 L146 238 L176 238 L194 204
           L210 216 L226 160 L240 182 L258 226 L276 226 L292 198 L310 232 L332 218 L352 248 L384 248 L400 236"
        fill="none" stroke="#e5e7eb" stroke-width="1.6" stroke-linejoin="round" filter="url(#glow)"/>
  <g stroke="#fff" stroke-width="3.2" filter="url(#glow)">
    <line x1="74" y1="206" x2="92" y2="206"/><line x1="146" y1="238" x2="176" y2="238"/>
    <line x1="258" y1="226" x2="276" y2="226"/><line x1="352" y1="248" x2="384" y2="248"/>
  </g>
  <g fill="#facc15" font-family="ui-monospace, Consolas, monospace" font-weight="700" font-size="11" text-anchor="middle">
    <text x="83" y="222">×5</text><text x="267" y="242">×3</text><text x="368" y="264">×2</text>
  </g>
  <!-- lunar module, tilted, engine firing -->
  <g transform="translate(176 118) rotate(-14) scale(2.6)" fill="none" stroke="#ffffff" stroke-width=".7"
     stroke-linejoin="round" filter="url(#glow)">
    <path d="M5.1 -1.9 L2.1 1.1 L-2.1 1.1 L-5.1 -1.9 L-5.1 -6.1 L-2.1 -9.1 L2.1 -9.1 L5.1 -6.1 Z"/>
    <rect x="-7" y="1.5" width="14" height="4.5"/>
    <path d="M-6 6 L-9 9 M6 6 L9 9 M-11 9 L-7 9 M7 9 L11 9 M-2 6 L-3 8.5 L3 8.5 L2 6"/>
    <path d="M-2.5 9 L0 20 L2.5 9" stroke="#fde68a"/>
  </g>
  <!-- readouts -->
  <g fill="#e5e7eb" font-family="ui-monospace, Consolas, monospace" font-size="9" opacity=".85">
    <text x="12" y="20">SCORE  0250</text><text x="12" y="32">FUEL   0712</text>
    <text x="388" y="20" text-anchor="end">ALTITUDE  128</text><text x="388" y="32" text-anchor="end">VERTICAL SPEED  9 ↓</text>
  </g>
</svg>
