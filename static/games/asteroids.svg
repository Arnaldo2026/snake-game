<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#000"/>
  <g fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">
    <!-- big rocks -->
    <path d="M60 52 L92 40 L124 54 L130 84 L112 112 L80 116 L56 100 L48 74 Z"/>
    <path d="M272 186 L306 176 L338 190 L346 222 L326 252 L290 256 L266 238 L260 208 Z"/>
    <path d="M300 40 L330 34 L352 50 L350 78 L326 92 L300 84 L290 62 Z"/>
    <!-- medium and small -->
    <path d="M168 212 L186 206 L200 216 L198 234 L182 242 L166 234 Z"/>
    <path d="M206 88 L218 84 L226 92 L222 104 L210 106 L202 98 Z"/>
    <path d="M110 232 L120 228 L128 236 L124 246 L114 248 L106 240 Z"/>
  </g>
  <!-- ships -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)">
    <g transform="translate(196 156) rotate(-60)" stroke="#4ade80">
      <path d="M18 0 L-13 -11 M18 0 L-13 11 M-8 -8 L-8 8"/>
      <path d="M-8 -4 L-22 0 L-8 4" stroke="#fde68a"/>
    </g>
    <g transform="translate(150 170) rotate(200)" stroke="#60a5fa">
      <path d="M18 0 L-13 -11 M18 0 L-13 11 M-8 -8 L-8 8"/>
    </g>
  </g>
  <!-- shots -->
  <g filter="url(#glow)">
    <circle cx="208" cy="132" r="2.4" fill="#4ade80"/><circle cx="216" cy="117" r="2.4" fill="#4ade80"/>
    <circle cx="128" cy="164" r="2.4" fill="#60a5fa"/>
  </g>
  <!-- saucer -->
  <g transform="translate(340 140)" fill="none" stroke="#f87171" stroke-width="1.8" filter="url(#glow)">
    <path d="M-20 0 L20 0 L11 7 L-11 7 Z M-20 0 L-11 -7 L11 -7 L20 0 M-6 -7 L-4 -13 L4 -13 L6 -7"/>
  </g>
  <!-- stars -->
  <g fill="#fff" opacity=".4">
    <circle cx="20" cy="160" r=".9"/><circle cx="240" cy="20" r=".9"/><circle cx="380" cy="270" r=".9"/>
    <circle cx="160" cy="30" r=".7"/><circle cx="40" cy="280" r=".8"/>
  </g>
</svg>
