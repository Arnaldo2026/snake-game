<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#000"/>
  <!-- background stars -->
  <g fill="#ffffff" opacity=".55">
    <circle cx="22" cy="30" r="1"/><circle cx="64" cy="250" r="1.2"/><circle cx="110" cy="40" r=".8"/>
    <circle cx="150" cy="270" r="1"/><circle cx="240" cy="22" r="1.1"/><circle cx="300" cy="280" r=".9"/>
    <circle cx="350" cy="40" r="1.2"/><circle cx="380" cy="160" r=".8"/><circle cx="30" cy="150" r=".9"/>
    <circle cx="190" cy="110" r=".7"/><circle cx="270" cy="190" r=".8"/><circle cx="90" cy="190" r=".7"/>
  </g>
  <!-- orbit -->
  <ellipse cx="200" cy="150" rx="128" ry="88" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="3 6"/>
  <!-- central star -->
  <g stroke="#ffffff" stroke-width="2" filter="url(#glow)" stroke-linecap="round">
    <line x1="200" y1="136" x2="200" y2="164"/><line x1="186" y1="150" x2="214" y2="150"/>
    <line x1="190" y1="140" x2="210" y2="160"/><line x1="210" y1="140" x2="190" y2="160"/>
    <line x1="194" y1="133" x2="206" y2="167"/><line x1="183" y1="156" x2="217" y2="144"/>
  </g>
  <circle cx="200" cy="150" r="4" fill="#ffffff" filter="url(#glow)"/>
  <!-- green ship with thrust -->
  <g transform="translate(92 196) rotate(-38)" filter="url(#glow)" fill="none" stroke-linejoin="round" stroke-width="2.2">
    <path d="M20 0 L-13 -12 L-7 0 L-13 12 Z" stroke="#4ade80"/>
    <path d="M-8 -5 L-24 0 L-8 5" stroke="#fde68a"/>
  </g>
  <!-- blue ship -->
  <g transform="translate(305 92) rotate(150)" filter="url(#glow)" fill="none" stroke-linejoin="round" stroke-width="2.2">
    <path d="M20 0 L-13 -12 L-7 0 L-13 12 Z" stroke="#60a5fa"/>
  </g>
  <!-- torpedoes -->
  <g filter="url(#glow)">
    <circle cx="128" cy="168" r="2.6" fill="#4ade80"/><circle cx="150" cy="151" r="2.6" fill="#4ade80"/>
    <circle cx="276" cy="108" r="2.6" fill="#60a5fa"/>
  </g>
  <!-- asteroid -->
  <path d="M316 214 L334 206 L350 214 L354 232 L344 248 L324 250 L310 238 L308 222 Z"
        fill="none" stroke="#cbd5e1" stroke-width="1.8" filter="url(#glow)"/>
</svg>
