<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10141a">
<title>Game Room</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
  :root {
    --bg: #10141a;
    --card: #171d26;
    --board: #171d26;
    --grid: #1c232e;
    --line: #2a3442;
    --food: #f87171;
    --text: #e6edf3;
    --muted: #8b98a8;
    --accent: #4ade80;
    --btn: #232c39;
    --btn-on: #34445a;
    --err: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 10px 16px 16px; gap: 10px; }
  .hidden { display: none !important; }
  /* version badge: bottom-right corner on PCs; at the end of the page on phones (see the media queries) */
  #appVersion { position: fixed; right: 10px; bottom: 8px; z-index: 6; font-size: 12px; font-weight: 600;
                color: #cbd5e1; background: rgba(16, 20, 26, .85); border: 1px solid var(--line); border-radius: 6px;
                padding: 3px 8px; font-variant-numeric: tabular-nums; pointer-events: none; }
  body.in-game #appVersion { display: none; }
  #newVersion { width: 100%; max-width: 960px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
                padding: 8px 12px; border-radius: 10px; background: #14532d; color: #dcfce7; font-weight: 600; font-size: 14px; }
  #newVersion.hidden { display: none; }
  header { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; flex: 1; white-space: nowrap; }
  #btnSound { background: none; font-size: 20px; padding: 4px 6px; line-height: 1; }
  #roomChip { font-size: 13px; color: var(--muted); }
  #roomChip b { color: var(--text); letter-spacing: 2px; }

  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-top: 4px; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .err { font-size: 14px; color: var(--err); min-height: 18px; }
  .row { display: flex; gap: 8px; }
  input, select { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line);
          border-radius: 10px; padding: 11px 12px; font-size: 16px; font-family: inherit; }
  select:disabled { opacity: .7; }
  input:focus, select:focus { outline: 2px solid var(--btn-on); border-color: transparent; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 11px 14px; background: var(--btn);
           color: var(--text); cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  button.primary { background: var(--accent); color: #062411; font-weight: 700; font-size: 16px; padding: 13px; }
  button.link { background: none; color: var(--muted); text-decoration: underline; padding: 6px; }
  button.danger { background: #dc2626; color: #fff; font-weight: 700; }
  .or { text-align: center; color: var(--muted); font-size: 13px; }

  .roomrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .code { font-size: 40px; font-weight: 800; letter-spacing: 6px; font-variant-numeric: tabular-nums; }
  #qr { background: #fff; padding: 6px; border-radius: 8px; line-height: 0; }
  #qr:empty { display: none; }
  #qr img, #qr canvas { width: 96px; height: 96px; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 10px; padding: 9px 12px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .tag { font-size: 12px; color: var(--muted); }
  li .num { font-variant-numeric: tabular-nums; font-weight: 700; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { padding: 10px 6px; font-size: 14px; }
  .seg button.on { background: var(--btn-on); outline: 2px solid var(--accent); outline-offset: -2px; }
  #lbSettings { display: flex; flex-direction: column; gap: 10px; }
  #lbTouch { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  #lbTouch:empty { display: none; }
  #lbTouch .seg button { font-size: 12px; padding: 10px 2px; }
  /* buttons a game adds to the top bar (e.g. a data pad), and its overlay on the board */
  #gameTools { display: flex; gap: 6px; }
  #gameTools button { padding: 4px 8px; font-size: 17px; line-height: 1.2; }
  #gameTools button.on { background: var(--btn-on); outline: 2px solid var(--accent); outline-offset: -2px; }
  #overlay { position: absolute; top: 8px; left: 8px; pointer-events: none; }
  #overlay:empty { display: none; }
  #lbTouch .tag { font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; }

  #results { background: var(--bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #results .title { font-size: 18px; font-weight: 700; }
  #lbLive { background: var(--bg); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px;
            font-size: 14px; line-height: 1.4; }

  #game { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  #hud { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 30px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px;
          padding: 4px 10px 4px 6px; font-size: 13px; }
  .chip.dead { opacity: .4; }
  .chip.me { outline: 1px solid var(--muted); }
  .chip b { font-variant-numeric: tabular-nums; }
  #hudRight { display: flex; align-items: center; gap: 10px; flex: none; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; white-space: nowrap; }
  #btnExit { padding: 6px 12px; font-size: 14px; }

  #wrap { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; border-radius: 10px; background: var(--board); }
  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 8px; text-align: center; padding: 16px; pointer-events: none; }
  #msg.dim { background: rgba(16, 20, 26, .6); border-radius: 10px; }
  #msg .big { font-size: 30px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #msg .big.huge { font-size: 72px; }
  #msg .small { color: var(--text); font-size: 15px; opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.7); }

  /* on-screen buttons, laid out by each game (touch devices only) */
  #stage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pad { display: none; gap: 8px; grid-auto-rows: 54px; }
  .pad button { font-size: 22px; touch-action: none; padding: 0; user-select: none; -webkit-user-select: none; }
  .pad button.held { background: var(--btn-on); }
  .pad button small { display: block; font-size: 10px; color: var(--muted); }
  /* phone or tablet held sideways: no header while playing, controls left and right of the board */
  body.landscape.in-game { padding: 4px 10px 4px; gap: 4px; }
  body.landscape.in-game > header { display: none; }
  body.landscape.in-game #game { gap: 4px; }
  body.landscape #hud { max-width: none; min-height: 0; }
  /* sideways while playing: the scoreboard floats in the empty corners beside the board (scores top left,
     buttons top right), so the board gets the full height of the screen */
  body.landscape.in-game #hud { position: fixed; top: 4px; left: 10px; right: 10px; width: auto; align-items: flex-start;
                                pointer-events: none; z-index: 5; }
  body.landscape.in-game #hud > * { pointer-events: auto; }
  body.landscape.in-game #chips { flex-direction: column; align-items: flex-start; }
  body.landscape.in-game #hudRight { flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: 0 1 auto; }
  body.landscape.in-game #timer { flex: 1 0 100%; text-align: right; white-space: normal; font-size: 13px; line-height: 1.25; }
  body.landscape.in-game #timer:empty { display: none; }
  body.landscape #hud .chip { padding: 2px 8px 2px 5px; font-size: 12px; }
  body.landscape #timer { font-size: 14px; }
  body.landscape #stage { flex-direction: row; align-items: flex-end; justify-content: center; gap: 14px; width: 100%; }
  body.landscape .pad { flex: none; }
  body.landscape #dragHint, body.landscape #status:empty { display: none !important; }
  /* a vertical lever (e.g. a variable throttle) */
  .lever { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
           background: var(--btn); border-radius: 10px; padding: 6px 0; touch-action: none; }
  .lever input { writing-mode: vertical-lr; direction: rtl; -webkit-appearance: slider-vertical; appearance: slider-vertical;
                 width: 44px; flex: 1; min-height: 0; margin: 0; accent-color: var(--accent); padding: 0; border: 0; background: none; }
  .lever small { font-size: 10px; color: var(--muted); }
  .lever.h { padding: 0 12px; }
  .lever.h input { writing-mode: horizontal-tb; direction: ltr; -webkit-appearance: auto; appearance: auto;
                   width: 100%; height: 36px; flex: none; }
  body.touch-ui #pad { display: grid; }
  body.touch-ui.landscape #padL:not(:empty) { display: grid; }
  body.touch-ui #keysHelp { display: none; }
  #keysHelp { text-align: center; }

  /* touch screens: drag anywhere instead of buttons, plus vibration (games that offer it) */
  #touchBar { display: none; gap: 6px; }
  #touchBar button { padding: 4px 8px; font-size: 17px; line-height: 1.2; }
  #dragHint { display: none; text-align: center; font-size: 13px; color: var(--muted); padding: 0 8px; }
  body.has-drag #touchBar { display: flex; }
  body.has-drag #dragHint { display: block; }
  html.drag-mode, body.drag-mode { touch-action: none; overscroll-behavior: none; }
  /* thumb sliders (a layout with sticks): a ring where the thumb landed, a knob that follows it up and down */
  html.sticks-mode, body.sticks-mode { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  .stick { position: fixed; width: 64px; height: 150px; margin: -75px 0 0 -32px; border-radius: 32px; z-index: 6;
           border: 2px solid rgba(148,163,184,.35); background: rgba(15,23,42,.25); pointer-events: none; }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%;
                 background: rgba(226,232,240,.35); transform: translate(-50%, -50%);
                 display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
  .stick.up .knob, .stick.down .knob { background: rgba(74,222,128,.55); }
  .stick .lab { position: absolute; left: 0; right: 0; text-align: center; font-size: 15px; color: rgba(226,232,240,.6); }
  .stick .lab.u { top: 6px; } .stick .lab.d { bottom: 6px; }
  body.drag-mode .pad { display: none !important; }
  #wrap.flash::after { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
                       box-shadow: inset 0 0 0 4px #ef4444, inset 0 0 48px rgba(239,68,68,.65); animation: flash .7s forwards; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  #status { font-size: 12px; color: var(--muted); min-height: 16px; }
  #status.bad { color: var(--err); }

  /* notices and the host's join prompt float at the top */
  #float { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 24px));
           display: flex; flex-direction: column; gap: 8px; z-index: 20; pointer-events: none; }
  .toast { background: #232c39; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px;
           box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: opacity .4s; }
  .toast.fade { opacity: 0; }
  #admit { pointer-events: auto; background: var(--card); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px;
           box-shadow: 0 8px 24px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 10px; }
  #admit .title { font-weight: 700; }
  #admit .row { flex-wrap: wrap; }
  #admit .row button { flex: 1 1 auto; padding: 9px 10px; font-size: 14px; }

  /* home screen: a picture tile for each game fills the background */
  body > *:not(#gallery):not(#float):not(#modal):not(.stick):not(#appVersion) { position: relative; z-index: 1; }
  /* two rows of half-screen cartridges; empty slots say INSERT CARTRIDGE */
  #gallery { position: fixed; inset: 0; z-index: 0; display: grid;
             grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 50vh); }
  .tile.empty { cursor: default; background: #0b0e13; border: 2px dashed #2a3442; border-radius: 0;
                display: flex; align-items: center; justify-content: center; }
  .tile.empty::after { display: none; }
  .tile.empty span { font-family: ui-monospace, Consolas, monospace; font-weight: 700; letter-spacing: 3px;
                     color: #4b5868; font-size: clamp(13px, 1.5vw, 20px); text-align: center; line-height: 1.6; }
  .tile.empty span::after { content: "_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tile { position: relative; overflow: hidden; border: 0; border-radius: 0; padding: 0; background: #000; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .5;
              transition: opacity .3s, transform .8s; }
  .tile::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                 background: linear-gradient(to bottom, rgba(16,20,26,.35), rgba(16,20,26,0) 40%, rgba(16,20,26,.85)); }
  .tile:hover img, .tile.on img { opacity: .78; transform: scale(1.03); }
  .tile .tname { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 1; text-align: center;
                 font-size: clamp(20px, 2.6vw, 40px); font-weight: 800; letter-spacing: 2px; color: #fff;
                 text-shadow: 0 3px 18px rgba(0,0,0,.8); }
  .tile.on .tname { color: var(--accent); }
  .tile { outline: 1px solid var(--line); }
  #home, #lobby { background: rgba(23, 29, 38, .9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #gallery.locked .tile { cursor: default; }
  @media (max-width: 700px) {
    /* phones: the cartridges sit below the form and the page scrolls */
    #gallery { position: static; order: 99; width: calc(100% + 32px); margin: 6px -16px -16px;
               grid-template-columns: repeat(2, 1fr) !important; grid-template-rows: none; grid-auto-rows: 24vh; }
    .tile .tname { bottom: 14px; font-size: 18px; letter-spacing: 1px; padding: 0 4px; }
    .tile.empty span { font-size: 12px; letter-spacing: 2px; }
    body.in-lobby #gallery { display: none; }                   /* the room screen scrolls on phones */
    #appVersion { position: static; order: 100; align-self: center; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    /* phones held sideways: same idea, a row of four cartridges below the form */
    #gallery { position: static; order: 99; width: calc(100% + 32px); margin: 6px -16px -16px;
               grid-template-columns: repeat(4, 1fr) !important; grid-template-rows: none; grid-auto-rows: 150px; }
    .tile .tname { bottom: 12px; font-size: 18px; letter-spacing: 1px; padding: 0 4px; }
    .tile.empty span { font-size: 12px; letter-spacing: 2px; }
    body.in-lobby #gallery { display: none; }
    #appVersion { position: static; order: 100; align-self: center; }
  }

  /* home: public rooms anyone can join */
  #openRooms { display: flex; flex-direction: column; gap: 6px; max-height: 230px; overflow-y: auto; }
  #openRooms li { gap: 8px; padding: 7px 8px 7px 12px; }
  #openRooms li .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #openRooms li .what b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #openRooms li .what span { font-size: 12px; color: var(--muted); }
  #openRooms li button { padding: 7px 14px; font-size: 14px; flex: none; }
  #openRooms .empty { font-size: 13px; color: var(--muted); padding: 2px 0; }
  .pubtag { font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; border-radius: 999px;
            background: var(--btn); color: var(--muted); }
  .pubtag.on { background: rgba(74, 222, 128, .15); color: var(--accent); }

  #modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: center;
           justify-content: center; padding: 16px; z-index: 30; }
  #modal .card { max-width: 340px; }
  #modal .title { font-size: 18px; font-weight: 700; }
  #modal .row button { flex: 1; }
</style>
</head>
<body>
  <div id="gallery" aria-label="Games"></div>
  <header>
    <h1>Game Room</h1>
    <div id="roomChip" class="hidden"><span id="chipGame"></span> · Room <b id="chipCode"></b></div>
    <button id="btnSound" title="Sound on/off" aria-label="Sound on/off">🔊</button>
  </header>

  <div id="newVersion" class="hidden"><span>A new version is ready</span><button id="btnReload">Reload</button></div>

  <!-- ============ HOME ============ -->
  <section id="home" class="card">
    <div class="label">Your name</div>
    <input id="inName" maxlength="12" placeholder="e.g. Arnaldo" autocomplete="off">
    <div class="label">Game</div>
    <select id="inGame"></select>
    <button id="btnCreate" class="primary">Create a room</button>
    <div class="or">or join a room with its code</div>
    <div class="row">
      <input id="inCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"
             style="text-transform: uppercase; letter-spacing: 4px; text-align: center;">
      <button id="btnJoin">Join</button>
    </div>
    <div id="homeErr" class="err"></div>
    <div class="label" style="margin-top:6px">Open rooms</div>
    <ul id="openRooms"><li class="empty">Looking for rooms…</li></ul>
  </section>

  <!-- ============ LOBBY ============ -->
  <section id="lobby" class="card hidden">
    <div class="roomrow">
      <div>
        <div class="label">Room code</div>
        <div id="lbCode" class="code"></div>
      </div>
      <div id="qr" title="Scan to join"></div>
    </div>
    <div class="row">
      <input id="lbLink" readonly>
      <button id="btnCopy">Copy</button>
      <button id="btnShare" class="hidden">Share</button>
    </div>
    <div id="lbVis"></div>

    <div id="lbLive" class="hidden"></div>

    <div id="results" class="hidden">
      <div class="title" id="resTitle"></div>
      <ul id="resList"></ul>
    </div>

    <div class="label">Players <span id="lbCount"></span></div>
    <ul id="lbPlayers"></ul>

    <div class="label">Game</div>
    <select id="lbGame"></select>
    <div id="lbSettings"></div>
    <div id="lbTouch"></div>

    <button id="btnStart" class="primary">Start</button>
    <div id="lbWait" class="hint" style="text-align:center"></div>
    <button id="btnLeave" class="link">Leave room</button>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game" class="hidden">
    <div id="hud">
      <div id="chips"></div>
      <div id="hudRight"><div id="timer"></div><span id="gameTools"></span><span id="touchBar"><button id="btnTouchMode"></button><button id="btnVibe"></button></span><button id="btnExit">Exit</button></div>
    </div>
    <div id="stage">
    <div id="padL" class="pad"></div>
    <div id="wrap">
      <canvas id="board"></canvas>
      <div id="overlay"></div>
      <div id="msg" class="hidden"><div class="big" id="msgBig"></div><div class="small" id="msgSmall"></div></div>
    </div>
    <div id="pad" class="pad"></div>
    </div>
    <div id="dragHint"></div>
    <div id="keysHelp" class="hint"></div>
  </section>

  <div id="status">Connecting…</div>
  <div id="appVersion" title="Version · commit">v__APP_VERSION__</div>

  <div id="float">
    <div id="admit" class="hidden">
      <div class="title" id="admitTitle"></div>
      <div class="hint" id="admitText"></div>
      <div class="row">
        <button id="btnAdmitRestart" class="primary">Restart with them</button>
        <button id="btnAdmitNow">Let in now</button>
        <button id="btnAdmitLater">Later</button>
      </div>
    </div>
    <div id="toasts" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div id="modal" class="hidden">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="title" id="modalTitle">Exit this match?</div>
      <div class="hint">You'll be out of this match and wait in the room for the next one.</div>
      <div class="row">
        <button id="btnNo">Keep playing</button>
        <button id="btnYes" class="danger">Exit</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("board"), ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const color = n => css.getPropertyValue(n).trim();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;

  let ws = null;
  let me = null;          // my player id
  let code = null;        // room I'm in (also used to rejoin after a dropped connection)
  let st = null;          // latest room state from the server
  let holdUntil = 0;      // keep the board visible briefly after a match ends
  let qrFor = null;
  let catalog = [{ id: "snake", name: "Snake" }];
  const dismissed = new Set();   // join requests the host answered "Later"

  // ---------------------------------------------------------- storage
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  $("inName").value = store.get("room.name") || store.get("snake.name") || "";
  const urlRoom = new URLSearchParams(location.search).get("room");
  if (urlRoom) $("inCode").value = urlRoom.toUpperCase().slice(0, 4);

  function fillGameSelect(sel, value) {
    const html = catalog.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join("");
    if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; }
    if (value) sel.value = value;
  }
  fillGameSelect($("inGame"), store.get("room.game") || "snake");

  // home background: one picture tile per game; clicking a tile picks that game
  function renderGallery() {
    const games = catalog.filter(g => g.image);
    // PC: two rows, at least four columns; phone: two columns. Empty slots wait for a cartridge.
    const phone = matchMedia("(max-width: 700px)").matches;
    const sideways = !phone && matchMedia("(max-height: 500px) and (orientation: landscape)").matches;
    const cols = phone ? 2 : sideways ? 4 : Math.max(4, Math.ceil(games.length / 2));
    const slots = phone ? games.length + (games.length % 2) : sideways ? Math.ceil(games.length / 4) * 4 : cols * 2;
    $("gallery").style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    const html = games.map(g => `
      <button class="tile" data-id="${esc(g.id)}" aria-label="${esc(g.name)}">
        <img src="${esc(g.image)}" alt=""><span class="tname">${esc(g.name)}</span></button>`).join("")
      + `<div class="tile empty" aria-hidden="true"><span>INSERT<br>CARTRIDGE</span></div>`.repeat(Math.max(0, slots - games.length));
    if ($("gallery").dataset.html !== html) { $("gallery").innerHTML = html; $("gallery").dataset.html = html; }
    // home: the game you're about to create; room screen: the room's current game
    const inRoom = screen() === "lobby" && st;
    const cur = inRoom ? st.game_id : $("inGame").value;
    document.querySelectorAll(".tile").forEach(t => t.classList.toggle("on", t.dataset.id === cur));
    $("gallery").classList.toggle("locked", !!inRoom && !(st.host === me && st.state === "lobby"));
  }
  $("gallery").addEventListener("click", e => {
    const t = e.target.closest(".tile");
    if (!t) return;
    if (screen() === "lobby" && st) {
      // in a room only the host can switch game, and only between matches
      if (st.host === me && st.state === "lobby" && t.dataset.id !== st.game_id) send({ type: "game", id: t.dataset.id });
      return;
    }
    $("inGame").value = t.dataset.id;
    store.set("room.game", t.dataset.id);
    renderGallery();
  });
  $("inGame").addEventListener("change", () => { store.set("room.game", $("inGame").value); renderGallery(); });

  // game scripts are loaded on demand from /static/games/<id>.js
  const loading = {};
  function gameModule(id) {
    if (window.GAMES && window.GAMES[id]) return window.GAMES[id];
    if (!loading[id]) {
      loading[id] = true;
      const s = document.createElement("script");
      s.src = `/static/games/${encodeURIComponent(id)}.js`;
      s.onload = update;
      document.head.appendChild(s);
    }
    return null;
  }
  gameModule("snake");

  // ---------------------------------------------------------- sound
  // generated with the Web Audio API, so there are no audio files to load
  let actx = null;
  let soundOn = store.get("snake.sound") !== "off";
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  ["pointerdown", "keydown", "touchstart"].forEach(ev =>
    window.addEventListener(ev, () => { if (soundOn) audio(); }, { passive: true }));

  function tone(freq, start, dur, type, vol, endFreq) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const SFX = {
    eat()    { tone(660, 0, .07, "square", .05); tone(990, .06, .09, "square", .05); },
    crash()  { tone(320, 0, .5, "sawtooth", .08, 55); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, i === 3 ? .45 : .14, "triangle", .12)); },
    end()    { tone(440, 0, .18, "triangle", .1); tone(330, .18, .32, "triangle", .1); },
    tick()   { tone(880, 0, .08, "sine", .08); },
    go()     { tone(1320, 0, .25, "sine", .1); },
    notice() { tone(740, 0, .1, "sine", .06); tone(988, .1, .14, "sine", .06); },
  };
  function play(name, delay) {
    if (!soundOn || !SFX[name]) return;
    if (delay) setTimeout(() => SFX[name](), delay); else SFX[name]();
  }
  function paintSound() { $("btnSound").textContent = soundOn ? "🔊" : "🔇"; }
  $("btnSound").onclick = () => {
    soundOn = !soundOn;
    store.set("snake.sound", soundOn ? "on" : "off");
    paintSound();
    if (soundOn) play("eat");
  };
  paintSound();

  // what game modules get to work with
  const api = {
    $, canvas, ctx, color, esc, fmtTime, play, tone, sfx: SFX,
    audio: () => (soundOn ? audio() : null),       // for continuous game sounds (e.g. an engine)
    soundOn: () => soundOn,
    st: () => st, me: () => me, store,
    setMessage(big, small, huge, dim) {
      $("msg").classList.toggle("hidden", !big && big !== 0);
      $("msg").classList.toggle("dim", !!dim);
      $("msgBig").textContent = big;
      $("msgBig").classList.toggle("huge", !!huge);
      $("msgSmall").textContent = small || "";
    },
  };

  function sounds(prev, next) {
    if (!me || !prev || prev.game_id !== next.game_id) return;
    const mod = gameModule(next.game_id);
    const crashed = mod && mod.sounds ? mod.sounds(api, prev, next) : false;
    if (prev.state === "match" && next.state === "lobby" && next.results) {
      const mine = prev.players.find(p => p.id === me);
      if (mine && !mine.waiting) play(next.results.winner === me ? "win" : "end", crashed ? 550 : 0);
    }
  }

  // ---------------------------------------------------------- notices
  function toast(text) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = text;
    $("toasts").appendChild(el);
    setTimeout(() => el.classList.add("fade"), 3600);
    setTimeout(() => el.remove(), 4100);
  }
  function showNotices(msg) {
    for (const n of msg.notices || []) {
      if (n.kind === "host") {
        toast(n.pid === me ? "You are now the host." : `${n.name} is now the host.`);
        continue;
      }
      if (n.pid === me) continue;
      if (n.kind === "join") {
        toast(msg.state === "match" ? `${n.name} entered the room – waiting to play` : `${n.name} joined the room`);
        play("notice");
      } else if (n.kind === "leave") {
        toast(`${n.name} left the room`);
      }
    }
  }

  // ---------------------------------------------------------- connection
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => {
      setStatus("");
      if (code) send({ type: "join", code, name: myName() });   // rejoin after a drop
    };
    ws.onmessage = ev => handle(JSON.parse(ev.data));
    ws.onclose = () => {
      me = null;
      setStatus(code ? "Connection lost – rejoining…" : "Disconnected – reconnecting…", true);
      setTimeout(connect, 1500);
      update();
    };
  }
  $("btnReload").onclick = () => location.reload();
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function setStatus(text, bad) { $("status").textContent = text; $("status").className = bad ? "bad" : ""; }
  function myName() { return $("inName").value.trim(); }

  function handle(msg) {
    if (msg.type === "hello") {
      catalog = msg.games;
      // the server restarted with another version (a deploy) while this page was open: offer a reload
      const mine = "__APP_VERSION__";
      if (msg.version && !mine.startsWith("__") && msg.version !== mine) {
        $("newVersion").firstElementChild.textContent = `A new version is ready (v${msg.version})`;
        $("newVersion").classList.remove("hidden");
      }
      fillGameSelect($("inGame"), $("inGame").value === "snake" ? (store.get("room.game") || "snake") : $("inGame").value);
      renderGallery();
      return;
    }
    if (msg.type === "rooms") {
      publicRooms = msg.rooms || [];
      renderRooms();
      return;
    }
    if (msg.type === "joined") {
      me = msg.you; code = msg.code;
      lastAspect = 0; reportScreen();
      $("homeErr").textContent = "";
      dismissed.clear();
      history.replaceState(null, "", `?room=${code}`);
    } else if (msg.type === "error") {
      $("homeErr").textContent = msg.msg;
      if (!me) { code = null; history.replaceState(null, "", location.pathname); }
    } else if (msg.type === "state") {
      if (msg.games) { catalog = msg.games; fillGameSelect($("inGame")); }
      if (st && st.state === "match" && msg.state === "lobby" && msg.results) {
        holdUntil = Date.now() + 2200;
        setTimeout(update, 2250);
      }
      const prev = st;
      guard("playing sounds", () => sounds(prev, msg));
      showNotices(msg);
      st = msg;
      if (st.state === "lobby") closeModal();
    }
    update();
  }

  // ---------------------------------------------------------- screens
  function myPlayer() { return st && st.players.find(p => p.id === me); }

  function screen() {
    if (!me || !st) return "home";
    if (st.state === "lobby") return Date.now() >= holdUntil ? "lobby" : "game";
    const mine = myPlayer();
    if (mine && (mine.quit || mine.waiting)) return "lobby";   // not in this match
    return "game";
  }

  function update() {
    const s = screen();
    $("home").classList.toggle("hidden", s !== "home");
    $("lobby").classList.toggle("hidden", s !== "lobby");
    $("game").classList.toggle("hidden", s !== "game");
    $("roomChip").classList.toggle("hidden", s === "home");
    $("gallery").classList.toggle("hidden", s !== "home" && s !== "lobby");
    if (s !== "home" && st) { $("chipCode").textContent = st.code; $("chipGame").textContent = st.game_name; }
    document.body.classList.toggle("in-lobby", s === "lobby");
    document.body.classList.toggle("in-game", s === "game");
    setLayout();
    renderGallery();
    if (s === "lobby") renderLobby();
    if (s !== "game") {
      releaseAll();
      // let games stop continuous sounds when their screen goes away
      for (const m of Object.values(window.GAMES || {})) {
        if (m.onHide) guard("stopping sounds", () => m.onHide());
      }
    }
    if (s === "game") {
      const mod = gameModule(st.game_id);
      if (mod) {
        setupControls(st.game_id, mod);
        guard("drawing", () => mod.render(api));
        placeHud();
        document.querySelectorAll("#gameTools button").forEach(b =>
          b.classList.toggle("on", !!(mod.toolOn && mod.toolOn(b.dataset.tool))));
      }
      $("btnExit").classList.toggle("hidden", st.state !== "match");
    }
    renderAdmit();
    paintTouch(s);
    paintSticks();
  }

  // A problem in one game's drawing or sound must never stop the page: the game keeps running
  // and a short note appears at the bottom, so it can be reported and fixed.
  let lastProblem = "";
  function guard(what, fn) {
    try { return fn(); }
    catch (err) {
      const text = `Problem while ${what}${st ? ` (${st.game_name})` : ""}: ${err && err.message ? err.message : err}`;
      if (text !== lastProblem) {
        lastProblem = text;
        console.error(text, err);
        setStatus(text, true);
      }
      return undefined;
    }
  }

  // ---------------------------------------------------------- host: join requests
  function renderAdmit() {
    const waiting = st && me && st.host === me && st.state === "match"
      ? st.players.filter(p => p.waiting && !dismissed.has(p.id)) : [];
    $("admit").classList.toggle("hidden", !waiting.length);
    if (!waiting.length) return;
    const names = waiting.map(p => p.name);
    const list = names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names.at(-1) : names[0];
    $("admitTitle").textContent = `${list} ${names.length > 1 ? "want" : "wants"} to play`;
    $("admitText").textContent = st.can_drop_in
      ? "Restart the match with everyone, let them in now, or let them wait for the next match."
      : "Restart the match with everyone now, or let them wait for the next match.";
    $("btnAdmitRestart").textContent = names.length > 1 ? "Restart with them" : `Restart with ${names[0]}`;
    $("btnAdmitNow").classList.toggle("hidden", !st.can_drop_in);
  }
  const waitingNow = () => st.players.filter(p => p.waiting && !dismissed.has(p.id));
  $("btnAdmitRestart").onclick = () => {
    const w = waitingNow();
    if (w.length) send({ type: "admit", pid: w[0].id, action: "restart" });
  };
  $("btnAdmitNow").onclick = () => {
    for (const p of waitingNow()) send({ type: "admit", pid: p.id, action: "now" });
  };
  $("btnAdmitLater").onclick = () => {
    for (const p of waitingNow()) dismissed.add(p.id);
    renderAdmit();
  };

  // ---------------------------------------------------------- home: public rooms
  let publicRooms = null;
  function renderRooms() {
    if (!publicRooms) return;
    const html = !publicRooms.length
      ? `<li class="empty">No public rooms right now. Create one and set it to Public in the room.</li>`
      : publicRooms.map(r => {
          const full = r.players >= r.max;
          return `<li><div class="what"><b>${esc(r.game)}</b>
            <span>${r.host ? `${esc(r.host)}'s room · ` : ""}${r.players}/${r.max} players · ${r.playing ? "match on" : "waiting to start"}</span></div>
            <button data-room="${esc(r.code)}" ${full ? "disabled" : ""}>${full ? "Full" : "Join"}</button></li>`;
        }).join("");
    if ($("openRooms").dataset.html !== html) { $("openRooms").innerHTML = html; $("openRooms").dataset.html = html; }
  }
  $("openRooms").addEventListener("click", e => {
    const b = e.target.closest("button[data-room]");
    if (!b || b.disabled) return;
    $("inCode").value = b.dataset.room;
    $("btnJoin").click();          // same checks as joining with a code (name needed)
  });

  // ---------------------------------------------------------- lobby
  function shareLink() { return `${location.origin}${location.pathname}?room=${st.code}`; }

  function renderLobby() {
    const isHost = st.host === me;
    const live = st.state !== "lobby";          // a match is running without me
    const canEdit = isHost && !live;
    const mine = myPlayer();
    const mod = gameModule(st.game_id);

    $("lbCode").textContent = st.code;
    $("lbLink").value = shareLink();
    $("btnShare").classList.toggle("hidden", !navigator.share);
    if (qrFor !== st.code && window.QRCode) {
      $("qr").innerHTML = "";
      new QRCode($("qr"), { text: shareLink(), width: 192, height: 192, correctLevel: QRCode.CorrectLevel.M });
      qrFor = st.code;
    }

    // private (code only) or public (listed on the home screen): the host decides
    const pub = !!st.public;
    const visHtml = isHost
      ? `<div><div class="label">Room</div><div class="seg">
          <button data-public="0" class="${pub ? "" : "on"}">🔒 Private</button>
          <button data-public="1" class="${pub ? "on" : ""}">🌐 Public</button></div>
          <div class="hint">${pub ? "Listed on everyone's home screen – anyone can join." : "Not listed – only people with the code or link can join."}</div></div>`
      : `<div class="hint"><span class="pubtag${pub ? " on" : ""}">${pub ? "PUBLIC" : "PRIVATE"}</span>
          ${pub ? "This room is listed on the home screen." : "Only people with the code can join."}</div>`;
    if ($("lbVis").dataset.html !== visHtml) { $("lbVis").innerHTML = visHtml; $("lbVis").dataset.html = visHtml; }

    $("lbLive").classList.toggle("hidden", !live);
    if (live) {
      const info = mod && mod.liveInfo ? ` – ${mod.liveInfo(st)}` : "";
      const after = mine && mine.waiting
        ? (isHost ? "You'll play in the next one." : "The host has been asked to let you in.")
        : "You'll play in the next one.";
      $("lbLive").innerHTML = `<b>Match in progress</b>${esc(info)}.<br>${after}`;
    }

    const r = st.results;
    $("results").classList.toggle("hidden", !r || live);
    if (r) {
      $("resTitle").textContent = r.title;
      $("resList").innerHTML = r.ranking.map((p, i) => `
        <li><span class="dot" style="background:${p.color}"></span>
            <span class="name">${i + 1}. ${esc(p.name)}${p.id === me ? ' <span class="tag">(you)</span>' : ""}</span>
            <span class="num">${p.score}</span></li>`).join("");
    }

    const status = p => !live ? ""
      : p.waiting ? "waiting"
      : p.quit ? "left match"
      : mod && mod.status ? mod.status(st, p.id) : "playing";
    $("lbCount").textContent = `(${st.players.length}/${st.max})`;
    $("lbPlayers").innerHTML = st.players.map(p => `
      <li><span class="dot" style="background:${p.color}"></span>
          <span class="name">${esc(p.name)}${p.id === me ? ' <span class="tag">(you)</span>' : ""}</span>
          ${live ? `<span class="tag">${esc(status(p))}</span>` : ""}
          ${p.id === st.host ? '<span class="tag">host</span>' : ""}
          ${p.wins ? `<span class="tag">${p.wins} win${p.wins > 1 ? "s" : ""}</span>` : ""}</li>`).join("");

    fillGameSelect($("lbGame"), st.game_id);
    $("lbGame").disabled = !canEdit;

    // settings, built from the list the game declares
    const html = st.schema.map((s, si) => {
      if (s.show_if && Object.entries(s.show_if).some(([k, v]) => st.settings[k] !== v)) return "";
      const cur = st.settings[s.key];
      const btns = s.options.map(([val, label], oi) =>
        `<button data-si="${si}" data-oi="${oi}" class="${val === cur ? "on" : ""}" ${canEdit ? "" : "disabled"}>${esc(label)}</button>`).join("");
      const hint = s.hints && s.hints[cur] ? `<div class="hint">${esc(s.hints[cur])}</div>` : "";
      return `<div><div class="label">${esc(s.label)}</div><div class="seg">${btns}</div>${hint}</div>`;
    }).join("");
    if ($("lbSettings").dataset.html !== html) { $("lbSettings").innerHTML = html; $("lbSettings").dataset.html = html; }

    renderTouchSetting(mod);

    $("btnStart").classList.toggle("hidden", !isHost || live);
    $("btnStart").textContent = r ? "Play again" : "Start";
    $("lbWait").textContent = live ? ""
      : isHost ? (st.players.length < 2 ? "You can start alone to try it, or wait for friends to join." : "")
      : "Waiting for the host to start…";
  }

  $("lbSettings").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled || !st) return;
    const s = st.schema[+b.dataset.si];
    send({ type: "setting", key: s.key, value: s.options[+b.dataset.oi][0] });
  });
  $("lbGame").addEventListener("change", e => send({ type: "game", id: e.target.value }));
  $("lbVis").addEventListener("click", e => {
    const b = e.target.closest("button[data-public]");
    if (b) send({ type: "visibility", public: b.dataset.public === "1" });
  });

  $("btnCreate").onclick = () => {
    if (!myName()) { $("homeErr").textContent = "Type your name first."; $("inName").focus(); return; }
    store.set("room.name", myName());
    store.set("room.game", $("inGame").value);
    send({ type: "create", name: myName(), game: $("inGame").value });
  };
  $("btnJoin").onclick = () => {
    const c = $("inCode").value.trim().toUpperCase();
    if (!myName()) { $("homeErr").textContent = "Type your name first."; $("inName").focus(); return; }
    if (c.length !== 4) { $("homeErr").textContent = "The room code has 4 characters."; $("inCode").focus(); return; }
    store.set("room.name", myName());
    send({ type: "join", code: c, name: myName() });
  };
  $("inCode").addEventListener("keydown", e => { if (e.key === "Enter") $("btnJoin").click(); });
  $("inName").addEventListener("keydown", e => {
    if (e.key === "Enter") ($("inCode").value.trim() ? $("btnJoin") : $("btnCreate")).click();
  });
  $("btnStart").onclick = () => send({ type: "start" });
  $("btnLeave").onclick = () => {
    code = null; me = null; st = null;
    history.replaceState(null, "", location.pathname);
    send({ type: "leave" });
    update();
  };
  $("btnCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(shareLink()); }
    catch (e) { $("lbLink").select(); document.execCommand("copy"); }
    $("btnCopy").textContent = "Copied";
    setTimeout(() => { $("btnCopy").textContent = "Copy"; }, 1500);
  };
  $("btnShare").onclick = () => {
    navigator.share({ title: st.game_name, text: `Join my ${st.game_name} room ${st.code}`, url: shareLink() }).catch(() => {});
  };

  // ---------------------------------------------------------- exit match (with confirmation)
  function openModal() { $("modal").classList.remove("hidden"); $("btnNo").focus(); }
  function closeModal() { $("modal").classList.add("hidden"); }
  const modalOpen = () => !$("modal").classList.contains("hidden");
  $("btnExit").onclick = openModal;
  $("btnNo").onclick = closeModal;
  $("btnYes").onclick = () => { closeModal(); send({ type: "quit" }); };
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

  // ---------------------------------------------------------- input
  // Each game declares its controls (see static/games/*.js):
  //   hold: false  -> a key press sends {dir: <name>}            (Snake: tap to turn)
  //   hold: true   -> press/release send {key: <name>, down: bool} (Space Wars: hold to thrust)
  //   keys: keyboard key -> control name;  pad: on-screen buttons for touch screens
  //   swipe: true  -> swiping on the board sends directions
  let controls = { keys: {}, pad: { buttons: [] } };
  let controlsFor = null;
  const held = new Set();
  const pointers = new Map();     // pointerId -> button, so several fingers work at once
  const sticks = new Map();       // thumb sliders: pointerId -> {cfg, oy, x, y, t, moved, on, el}

  // the game's column list, e.g. "64px 64px 12px 72px" or "repeat(3, 64px)"
  function parseCols(cols) {
    return String(cols || "").replace(/repeat\((\d+),\s*([^)]+)\)/g, (m, n, w) => Array(+n).fill(w.trim()).join(" "))
      .trim().split(/\s+/).filter(Boolean);
  }
  // Sideways on a touch screen the buttons go both sides of the board, one group per thumb:
  // columns up to the game's narrow spacer column (or landscapeSplit) on the left, the rest on the right.
  function splitPad(pad) {
    const cols = parseCols(pad.cols);
    let split = controls.landscapeSplit;
    let skip = 0;
    if (split == null) {
      const spacer = cols.findIndex(c => parseFloat(c) <= 16);
      if (spacer > 0) { split = spacer; skip = 1; } else split = Math.floor(cols.length / 2);
    }
    const left = [], right = [];
    for (const b of pad.buttons) {
      if (b.col <= split) left.push(Object.assign({}, b, { span: b.span ? Math.min(b.span, split - b.col + 1) : 0 }));
      else right.push(Object.assign({}, b, { col: b.col - split - skip }));
    }
    return [{ cols: cols.slice(0, split).join(" "), buttons: left },
            { cols: cols.slice(split + skip).join(" "), buttons: right }];
  }
  function padHtml(buttons) {
    return buttons.map(b => {
      const place = `grid-column:${b.col}${b.span ? ` / span ${b.span}` : ""};grid-row:${b.row}${b.rows ? ` / span ${b.rows}` : ""}`;
      if (b.type === "lever") {
        return `<div class="lever${b.horizontal ? " h" : ""}" style="${place}"><input type="range" min="0" max="100" value="${b.horizontal ? 50 : 0}"
          data-lever="${esc(b.key)}" aria-label="${esc(b.name || b.key)}"><small>${esc(b.sub || "")}</small></div>`;
      }
      return `<button data-key="${esc(b.key)}" aria-label="${esc(b.name || b.key)}" style="${place}">
        ${b.label}${b.sub ? `<small>${esc(b.sub)}</small>` : ""}</button>`;
    }).join("");
  }
  function setupControls(id, mod) {
    const want = `${id}:${landscape()}:${padLayout(id)}`;
    if (controlsFor === want) return;
    controlsFor = want;
    releaseAll();
    controls = Object.assign({ keys: {}, pad: { buttons: [] } }, mod.controls || {});
    const alt = controls.layouts && controls.layouts.find(l => l.id === padLayout(id));
    if (alt) controls = Object.assign({}, controls, { pad: alt.pad, landscapeSplit: alt.landscapeSplit, sticks: alt.sticks || null });
    const pad = controls.pad;
    if (landscape() && pad.buttons.length) {
      const [l, r] = splitPad(pad);
      $("padL").style.gridTemplateColumns = l.cols;
      $("padL").innerHTML = l.buttons.length ? padHtml(l.buttons) : "";
      $("pad").style.gridTemplateColumns = r.cols;
      $("pad").innerHTML = padHtml(r.buttons);
    } else {
      $("padL").innerHTML = "";
      $("pad").style.gridTemplateColumns = pad.cols || "";
      $("pad").innerHTML = padHtml(pad.buttons);
    }
    $("keysHelp").textContent = controls.help || "";
    $("overlay").innerHTML = "";
    gameTools = mod.tools || [];
    $("gameTools").innerHTML = gameTools.map(t =>
      `<button data-tool="${esc(t.id)}" title="${esc(t.title || "")}" aria-label="${esc(t.title || t.id)}">${t.label}</button>`).join("");
  }
  let gameTools = [];
  function useTool(id) {
    const mod = st && gameModule(st.game_id);
    if (mod && mod.onTool) guard("using a game tool", () => mod.onTool(api, id));
    update();
  }
  $("gameTools").addEventListener("click", e => {
    const b = e.target.closest("button[data-tool]");
    if (!b) return;
    b.blur();
    useTool(b.dataset.tool);
  });

  function press(key) {
    if (controls.hold) {
      if (held.has(key)) return;
      held.add(key);
      send({ type: "input", key, down: true });
    } else {
      send({ type: "input", dir: key });
    }
  }
  function release(key) {
    if (controls.hold && held.delete(key)) send({ type: "input", key, down: false });
  }
  function releaseAll() {
    for (const k of [...held]) release(k);
    endDrag();
    if (sticks.size) dropSticks();
    pointers.clear();
    document.querySelectorAll(".pad button.held").forEach(b => b.classList.remove("held"));
  }
  const keyName = e => (e.key.length === 1 ? e.key.toLowerCase() : e.key);

  window.addEventListener("keydown", e => {
    if (modalOpen()) { if (e.key === "Escape") closeModal(); return; }
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "Escape" && screen() === "game" && st.state === "match") { releaseAll(); openModal(); return; }
    const tool = screen() === "game" && gameTools.find(t => t.key === keyName(e));
    if (tool) { e.preventDefault(); if (!e.repeat) useTool(tool.id); return; }
    const ctl = controls.keys[keyName(e)];
    if (screen() === "game" && ctl) {
      e.preventDefault();
      // a button clicked earlier (e.g. the sound button) must not catch Space or Enter
      if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
      if (!(controls.hold && e.repeat)) press(ctl);
    } else if ((e.key === " " || e.key === "Enter") && screen() === "lobby" && st.host === me && st.state === "lobby") {
      e.preventDefault(); send({ type: "start" });
    }
  });
  window.addEventListener("keyup", e => {
    const ctl = controls.keys[keyName(e)];
    if (ctl) {
      if (screen() === "game") e.preventDefault();   // stops Space "clicking" a focused button
      release(ctl);
    }
  });
  window.addEventListener("blur", releaseAll);

  // on-screen buttons
  for (const el of [$("pad"), $("padL")]) el.addEventListener("pointerdown", e => {
    const b = e.target.closest("button");
    if (!b) return;
    e.preventDefault();
    pointers.set(e.pointerId, b);
    b.classList.add("held");
    press(b.dataset.key);
    if (!controls.hold) setTimeout(() => b.classList.remove("held"), 120);
  });
  const lift = e => {
    const b = pointers.get(e.pointerId);
    if (!b) return;
    pointers.delete(e.pointerId);
    b.classList.remove("held");
    if (![...pointers.values()].includes(b)) release(b.dataset.key);
  };
  window.addEventListener("pointerup", lift);
  window.addEventListener("pointercancel", lift);

  // levers send their position (0..1); while a finger is on one, the game won't move it
  let leverHeld = null;
  $("stage").addEventListener("input", e => {
    const lv = e.target.dataset.lever;
    if (lv) send({ type: "input", key: lv, value: e.target.value / 100 });
  });
  $("stage").addEventListener("pointerdown", e => { if (e.target.dataset && e.target.dataset.lever) leverHeld = e.target; }, true);
  window.addEventListener("pointerup", () => { leverHeld = null; });
  api.syncLever = (key, value) => {
    const el = document.querySelector(`.pad input[data-lever="${key}"]`);
    leverValue[key] = value;
    if (el && el !== leverHeld && Math.abs(el.value / 100 - value) > 0.02) el.value = Math.round(value * 100);
  };
  for (const el of [$("pad"), $("padL")]) el.addEventListener("contextmenu", e => e.preventDefault());

  // swipe on the board (games that ask for it): fires as soon as the finger has moved far enough
  const wrap = $("wrap");
  let sx = 0, sy = 0, tracking = false;
  wrap.addEventListener("touchstart", e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = !!controls.swipe;
  }, { passive: true });
  wrap.addEventListener("touchmove", e => {
    if (!tracking) return;
    e.preventDefault();
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    sx = t.clientX; sy = t.clientY;
  }, { passive: false });
  wrap.addEventListener("touchend", () => { tracking = false; });

  // sideways: keep the floating scoreboard inside the free strips left and right of the board
  function placeHud() {
    const sideways = landscape() && document.body.classList.contains("in-game");
    const b = sideways && $("wrap").getBoundingClientRect();
    $("chips").style.maxWidth = sideways ? Math.max(90, b.left - 18) + "px" : "";
    $("hudRight").style.maxWidth = sideways ? Math.max(90, window.innerWidth - b.right - 18) + "px" : "";
  }

  // ---------------------------------------------------------- board size
  const landscape = () => isTouch() && window.innerWidth > window.innerHeight;
  function setLayout() {
    document.body.classList.toggle("touch-ui", isTouch());
    document.body.classList.toggle("landscape", landscape());
  }
  // Room left for the board. Upright / PC: the width, and the height minus the game's reserve for header,
  // scoreboard and buttons. Sideways on a touch screen: the whole height under the scoreboard, and the
  // width between the two button groups.
  api.space = (maxW, reserve) => {
    if (landscape()) {
      const pads = [$("padL"), $("pad")].reduce((w, el) => w + (el.offsetWidth ? el.offsetWidth + 14 : 0), 0);
      const hud = document.body.classList.contains("in-game") ? 0 : ($("hud").offsetHeight || 30);
      return { w: Math.max(200, window.innerWidth - 20 - pads), h: Math.max(160, window.innerHeight - hud - 16) };
    }
    let h = window.innerHeight - reserve;
    if (isTouch() && $("pad").offsetHeight) {
      const top = $("wrap").getBoundingClientRect().top + window.scrollY;
      h = Math.min(h, window.innerHeight - top - $("pad").offsetHeight - 36);
    }
    return { w: Math.min(window.innerWidth - 32, maxW), h };
  };

  // Tell the server the shape of the space this screen has for a board (Space Wars' Auto arena uses it
  // to pick an arena that suits everybody). Estimated from the window, as the board isn't shown yet.
  let lastAspect = 0, aspectTimer = null;
  function reportScreen() {
    clearTimeout(aspectTimer);
    aspectTimer = setTimeout(() => {
      const W = window.innerWidth, H = window.innerHeight;
      let w, h;
      if (landscape()) { w = W - 20 - 300; h = H - 16; }              // buttons left and right
      else if (isTouch()) { w = W - 32; h = H - 330; }                  // header, scores, buttons below
      else { w = Math.min(W - 32, 1100); h = H - 170; }
      const aspect = Math.round(Math.max(0.3, Math.min(3, w / Math.max(100, h))) * 100) / 100;
      if (aspect !== lastAspect && me) { lastAspect = aspect; send({ type: "screen", aspect }); }
    }, 250);
  }
  window.addEventListener("resize", reportScreen);

  // ---------------------------------------------------------- touch screens: drag anywhere
  // Games can declare  drag: {key, axis: "x"|"y", flip, gain, tap, hint}.  On a phone or tablet a finger
  // dragged anywhere on the screen moves the paddle by the same amount (no buttons to find, nothing to
  // look at), a quick tap sends the "tap" control, and the phone can vibrate on hits. PCs are unchanged.
  let screenPref = ["on", "off"].includes(store.get("ui.touch")) ? store.get("ui.touch") : "auto";
  const isTouch = () => screenPref === "on" || (screenPref === "auto" && matchMedia("(pointer: coarse)").matches);
  const canVibe = typeof navigator.vibrate === "function";
  let touchMode = store.get("touch.mode") === "buttons" ? "buttons" : "drag";
  let vibeOn = store.get("touch.vibe") !== "off";
  const leverValue = {};          // where the game last said each knob is (0..1)
  const touches = new Map();      // pointerId -> {x, y, t, moved}
  let driver = null;              // the finger that moves the paddle
  let dragKey = null, dragValue = 0.5, localUntil = 0, sendQueued = false;
  const dragOn = () => isTouch() && !!controls.drag && touchMode === "drag";

  function paintTouch(s) {
    setLayout();
    const show = s === "game" && isTouch() && !!controls.drag;
    const on = show && touchMode === "drag";
    document.body.classList.toggle("has-drag", show);
    document.body.classList.toggle("drag-mode", on);
    document.documentElement.classList.toggle("drag-mode", on);
    if (!show) return;
    $("dragHint").textContent = touchMode === "drag"
      ? `${controls.drag.hint || "Drag anywhere to move"} · 🎮 top right for buttons`
      : "✋ top right: back to drag anywhere";
    $("btnTouchMode").textContent = touchMode === "drag" ? "🎮" : "✋";
    $("btnTouchMode").title = $("btnTouchMode").ariaLabel = touchMode === "drag" ? "Use on-screen buttons" : "Drag anywhere";
    $("btnVibe").textContent = vibeOn ? "📳" : "📴";
    $("btnVibe").title = $("btnVibe").ariaLabel = vibeOn ? "Vibration on" : "Vibration off";
    $("btnVibe").classList.toggle("hidden", !canVibe);
  }
  // drag sensitivity: a personal choice for this phone and this game (not the host's)
  const SENS = [[0.6, "Very slow"], [0.8, "Slow"], [1, "Normal"], [1.3, "Fast"], [1.7, "Very fast"]];
  function sensitivity(gid) {
    const v = parseFloat(store.get(`touch.sens.${gid}`));
    return SENS.some(([x]) => x === v) ? v : 1;
  }
  const SCREEN = [["auto", "Auto"], ["on", "Always"], ["off", "Never"]];
  // a game can offer other button layouts (controls.layouts: [{id, label, hint, pad}]); "classic" is its pad
  function padLayout(gid) { return store.get(`touch.layout.${gid}`) || "classic"; }
  function renderTouchSetting(mod) {
    const show = isTouch() && mod && mod.controls && mod.controls.drag;
    let html = `<div><div class="label">On-screen controls <span class="tag">(this device only)</span></div>
      <div class="seg">${SCREEN.map(([v, label]) =>
        `<button data-screen="${v}" class="${v === screenPref ? "on" : ""}">${label}</button>`).join("")}</div>
      <div class="hint">Auto shows them on phones and tablets. Choose Always for a touch screen without a keyboard
        that isn't recognised (e.g. a car's screen).</div></div>`;
    const layouts = isTouch() && mod && mod.controls && mod.controls.layouts;
    if (layouts) {
      const cur = padLayout(st.game_id);
      const all = [{ id: "classic", label: "Classic", hint: "The original button set." }, ...layouts];
      const pick = all.find(l => l.id === cur) || all[0];
      html += `<div><div class="label">Button layout <span class="tag">(this device only)</span></div>
        <div class="seg">${all.map(l => `<button data-layout="${esc(l.id)}" class="${l.id === pick.id ? "on" : ""}">${esc(l.label)}</button>`).join("")}</div>
        <div class="hint">${esc(pick.hint || "")}</div></div>`;
    }
    if (show) {
      const cur = sensitivity(st.game_id);
      html += `<div><div class="label">Drag sensitivity <span class="tag">(your phone only)</span></div>
        <div class="seg">${SENS.map(([v, label]) =>
          `<button data-sens="${v}" class="${v === cur ? "on" : ""}">${label}</button>`).join("")}</div>
        <div class="hint">How far the ${mod.controls.drag.axis === "y" ? "bar" : "paddle"} moves when you slide your finger.
          Faster = a shorter slide crosses the whole field.</div></div>`;
    }
    if ($("lbTouch").dataset.html !== html) { $("lbTouch").innerHTML = html; $("lbTouch").dataset.html = html; }
  }
  $("lbTouch").addEventListener("click", e => {
    const b = e.target.closest("button[data-sens], button[data-screen], button[data-layout]");
    if (!b || !st) return;
    if (b.dataset.layout) {
      store.set(`touch.layout.${st.game_id}`, b.dataset.layout);
      renderLobby();
      return;
    }
    if (b.dataset.screen) {
      screenPref = b.dataset.screen;
      store.set("ui.touch", screenPref);
      setLayout();
      relayout();
      lastAspect = 0; reportScreen();
      return;
    }
    store.set(`touch.sens.${st.game_id}`, b.dataset.sens);
    renderLobby();
  });

  function relayout() {
    for (const m of Object.values(window.GAMES || {})) if (m.onResize) m.onResize();
    update();
  }
  $("btnTouchMode").onclick = e => {
    touchMode = touchMode === "drag" ? "buttons" : "drag";
    store.set("touch.mode", touchMode);
    e.currentTarget.blur();
    endDrag();
    relayout();
  };
  $("btnVibe").onclick = e => {
    vibeOn = !vibeOn;
    store.set("touch.vibe", vibeOn ? "on" : "off");
    e.currentTarget.blur();
    if (vibeOn) api.buzz(30);
    update();
  };

  api.touchDrag = dragOn;                     // games give the field more room when there are no buttons
  api.dragging = () => driver !== null;
  // my own paddle is drawn where my finger put it, without waiting for the server
  api.dragValue = key => (dragKey === key && (driver !== null || Date.now() < localUntil)) ? dragValue : null;
  api.buzz = pattern => {
    if (!vibeOn || !canVibe || !isTouch()) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  };
  api.flash = () => {
    if (!isTouch()) return;
    const w = $("wrap");
    w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
  };

  function queueSend() {
    if (sendQueued) return;
    sendQueued = true;
    requestAnimationFrame(() => {
      sendQueued = false;
      if (dragKey === null) return;
      send({ type: "input", key: dragKey, value: dragValue, drag: true });
      if (screen() === "game" && st) {
        const mod = gameModule(st.game_id);
        if (mod) guard("drawing", () => mod.render(api));
      }
    });
  }
  function endDrag() {
    if (driver !== null) localUntil = Date.now() + 350;
    touches.clear();
    driver = null;
  }
  const notForDrag = el => el.closest && el.closest("button, input, select, a, #hud, #touchBar, #modal, #float, header");
  window.addEventListener("pointerdown", e => {
    if ((e.pointerType === "mouse" && screenPref !== "on") || !dragOn() || screen() !== "game" || modalOpen() || notForDrag(e.target)) return;
    e.preventDefault();
    if (soundOn) audio();
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY, t: Date.now(), moved: 0 });
    if (driver === null) {
      driver = e.pointerId;
      dragKey = controls.drag.key;
      // start from where the paddle is now (or where my finger left it a moment ago)
      if (Date.now() >= localUntil) dragValue = leverValue[dragKey] != null ? leverValue[dragKey] : 0.5;
    }
  }, { passive: false });
  window.addEventListener("pointermove", e => {
    const t = touches.get(e.pointerId);
    if (!t) return;
    e.preventDefault();
    const dx = e.clientX - t.x, dy = e.clientY - t.y;
    t.moved += Math.abs(dx) + Math.abs(dy);
    t.x = e.clientX; t.y = e.clientY;
    if (e.pointerId !== driver) return;
    const d = controls.drag;
    const size = Math.max(120, d.axis === "y" ? canvas.clientHeight : canvas.clientWidth);
    let delta = (d.axis === "y" ? dy : dx) * (d.gain || 1.5) * sensitivity(st && st.game_id) / size;
    if (d.flip) delta = -delta;
    dragValue = Math.min(1, Math.max(0, dragValue + delta));
    queueSend();
  }, { passive: false });
  const touchUp = e => {
    const t = touches.get(e.pointerId);
    if (!t) return;
    touches.delete(e.pointerId);
    // a quick tap without sliding: the game's tap control (e.g. serve)
    if (e.type === "pointerup" && controls.drag && controls.drag.tap && t.moved < 14 && Date.now() - t.t < 350) {
      send({ type: "input", key: controls.drag.tap, down: true });
      send({ type: "input", key: controls.drag.tap, down: false });
    }
    if (e.pointerId === driver) {
      driver = null;
      localUntil = Date.now() + 350;
      // another finger still down takes over
      const next = touches.keys().next();
      if (!next.done) driver = next.value;
    }
  };
  window.addEventListener("pointerup", touchUp);
  window.addEventListener("pointercancel", touchUp);

  // ---------------------------------------------------------- touch screens: thumb sliders
  // A button layout can declare  sticks: {left: {up, down, tap, upLabel, downLabel}, right: {...}}.
  // A thumb put down anywhere on that half of the screen (not on a button) becomes a slider: sliding up
  // holds the "up" control, sliding down holds "down", back to where it landed lets go of both; a quick
  // tap without sliding sends "tap". Several thumbs work at once.
  const STICK_DEAD = 12, STICK_MAX = 42;
  const sticksOn = () => isTouch() && !!controls.sticks && screen() === "game";
  function paintSticks() {
    const on = sticksOn();
    document.body.classList.toggle("sticks-mode", on);
    document.documentElement.classList.toggle("sticks-mode", on);
    if (!on && sticks.size) dropSticks();
  }
  function stickShow(s) {
    if (!s.el) {
      s.el = document.createElement("div");
      s.el.className = "stick";
      s.el.innerHTML = `<span class="lab u">${esc(s.cfg.upLabel || "")}</span><span class="lab d">${esc(s.cfg.downLabel || "")}</span><span class="knob"></span>`;
      s.el.style.left = s.x + "px";
      document.body.appendChild(s.el);
    }
    s.el.style.top = s.oy + "px";
    const d = Math.max(-STICK_MAX, Math.min(STICK_MAX, s.y - s.oy));
    s.el.querySelector(".knob").style.transform = `translate(-50%, calc(-50% + ${d}px))`;
    s.el.classList.toggle("up", !!s.on && s.on === s.cfg.up);
    s.el.classList.toggle("down", !!s.on && s.on === s.cfg.down);
  }
  function stickSet(s, key) {
    if (s.on === key) return;
    const was = s.on;
    s.on = key;
    // another thumb (or a button) may still hold the same control
    if (was && ![...sticks.values()].some(o => o.on === was) && ![...pointers.values()].some(b => b.dataset.key === was)) release(was);
    if (key) press(key);
  }
  function dropSticks() {
    for (const s of sticks.values()) { stickSet(s, null); if (s.el) s.el.remove(); }
    sticks.clear();
  }
  window.addEventListener("pointerdown", e => {
    if ((e.pointerType === "mouse" && screenPref !== "on") || !sticksOn() || modalOpen() || notForDrag(e.target)) return;
    const cfg = controls.sticks[e.clientX < window.innerWidth / 2 ? "left" : "right"];
    if (!cfg) return;
    e.preventDefault();
    if (soundOn) audio();
    const s = { cfg, oy: e.clientY, x: e.clientX, y: e.clientY, t: Date.now(), moved: 0, on: null, el: null };
    sticks.set(e.pointerId, s);
    stickShow(s);
  }, { passive: false });
  window.addEventListener("pointermove", e => {
    const s = sticks.get(e.pointerId);
    if (!s) return;
    e.preventDefault();
    s.moved += Math.abs(e.clientX - s.x) + Math.abs(e.clientY - s.y);
    s.x = e.clientX; s.y = e.clientY;
    let dy = s.y - s.oy;
    // the ring follows a thumb that slides past its end, so changing direction is always a short move
    if (Math.abs(dy) > STICK_MAX) { s.oy = s.y - Math.sign(dy) * STICK_MAX; dy = s.y - s.oy; }
    const dead = STICK_DEAD / sensitivity(st && st.game_id);
    stickSet(s, dy < -dead ? s.cfg.up : dy > dead ? s.cfg.down : null);
    stickShow(s);
  }, { passive: false });
  const stickUp = e => {
    const s = sticks.get(e.pointerId);
    if (!s) return;
    sticks.delete(e.pointerId);
    stickSet(s, null);
    if (s.el) s.el.remove();
    if (e.type === "pointerup" && s.cfg.tap && s.moved < 14 && Date.now() - s.t < 300) {
      const k = s.cfg.tap;
      if (!held.has(k)) { press(k); setTimeout(() => release(k), 60); }
    }
  };
  window.addEventListener("pointerup", stickUp);
  window.addEventListener("pointercancel", stickUp);

  window.addEventListener("resize", () => {
    for (const m of Object.values(window.GAMES || {})) if (m.onResize) m.onResize();
    update();
  });
  window.addEventListener("load", () => { if (screen() === "lobby") { qrFor = null; renderLobby(); } });
  connect();
  update();
})();
</script>
</body>
</html>
